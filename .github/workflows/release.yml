name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Build and verify release
        run: make release

      - name: Verify application architectures
        run: lipo -archs "dist/Ping-Pong.app/Contents/MacOS/PingPong"

      - uses: actions/upload-artifact@v4
        with:
          name: Ping-Pong-${{ env.APP_VERSION }}
          path: dist/Ping-Pong-${{ env.APP_VERSION }}.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Ping-Pong-$APP_VERSION.dmg" \
            --generate-notes \
            --title "Ping-Pong $APP_VERSION"
